  <!-- â”€â”€ API Key Setup Popup â”€â”€ -->
  <div id="apikey-popup" class="fixed inset-0 z-50 flex items-center justify-center hidden"
       role="dialog" aria-modal="true" aria-labelledby="apikey-popup-title">
    <div id="apikey-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="relative z-10 bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 overflow-hidden">

      <!-- Header -->
      <div class="bg-indigo-700 px-6 py-5">
        <div class="flex items-center gap-3 mb-1">
          <svg class="w-5 h-5 text-white shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
          </svg>
          <h2 id="apikey-popup-title" class="text-white font-bold text-base">OpenAI API Key</h2>
        </div>
        <p class="text-indigo-100 text-xs leading-relaxed">
          Required for Chat, Summarize, and the OpenAI embedding model.
        </p>
      </div>

      <!-- Body -->
      <div class="px-6 py-5">
        <form onsubmit="return false">
          <label for="apikey-popup-input" class="block text-sm font-semibold text-gray-700 mb-2">
            Your API key
          </label>
          <input id="apikey-popup-input" type="password" placeholder="sk-…" autocomplete="off"
                 class="w-full border border-gray-400 rounded-lg px-3 py-2.5 text-sm font-mono text-gray-900 mb-3
                        focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600" />
        </form>

        <p id="apikey-popup-desc" class="text-xs text-gray-600 mb-5 leading-relaxed">
          Stored in <strong>browser localStorage</strong> and restored on each visit.
          Sent only to your own server — never to third parties.
        </p>

        <div class="flex items-center gap-3">
          <button id="apikey-popup-save"
                  class="flex-1 bg-indigo-700 text-white rounded-lg py-2 text-sm font-semibold hover:bg-indigo-800
                         transition-colors focus-visible:outline focus-visible:outline-3 focus-visible:outline-indigo-900 focus-visible:outline-offset-2">
            Save &amp; Continue
          </button>
          <button id="apikey-popup-skip"
                  class="px-4 py-2 text-sm font-medium text-gray-600 border border-gray-300 rounded-lg
                         hover:bg-gray-50 hover:border-gray-400 transition-colors
                         focus-visible:outline focus-visible:outline-2 focus-visible:outline-gray-600">
            Skip
          </button>
        </div>
        <p id="apikey-popup-error" class="text-xs text-red-700 mt-3 hidden" role="alert" aria-live="assertive"></p>
      </div>

    </div>
  </div>

  <!-- â”€â”€ Error popup â”€â”€ -->
  <div id="error-popup" class="fixed inset-0 z-50 flex items-center justify-center hidden"
       role="dialog" aria-modal="true" aria-labelledby="error-popup-title">

    <div id="error-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="dismissErrorPopup()"></div>

      </div>
    </div>

  <!-- â”€â”€ Confirm Delete Modal â”€â”€ -->

       role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm">
      <h2 id="confirm-modal-title" class="text-base font-bold mb-2 text-gray-900">Delete Upload</h2>
      <p id="confirm-msg" class="text-sm text-gray-700 mb-5"></p>
      <div id="delete-progress" class="hidden mb-4">
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Delete progress">
          <div id="delete-progress-fill" class="progress-fill"></div>
        </div>
        <p id="delete-progress-label" class="mt-2 text-xs text-gray-600" aria-live="polite">Deleting…</p>

  <!-- â”€â”€ Context Viewer Modal (Coding Manager) â”€â”€ -->

       role="dialog" aria-modal="true">

        <div class="flex items-center gap-1.5 shrink-0 flex-wrap justify-end">
          <label class="text-xs text-gray-500">Before</label>
          <input id="cm-ctx-before" type="number" min="0" max="50" value="10"

    </div>
  </div>
