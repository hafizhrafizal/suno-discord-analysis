  <!-- â”€â”€ Header â”€â”€ -->
  <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex items-center gap-2 sm:gap-4">

      <!-- Title + stats -->
      <div class="flex-1 min-w-0">
        <h1 class="text-base font-bold tracking-tight leading-none">Suno Discord Analysis</h1>
        <!-- text-indigo-100 on bg-indigo-700 â†’ 6.2:1 âœ“ -->
        <p id="stats-bar" class="text-indigo-100 text-xs mt-0.5 truncate" aria-live="polite" aria-atomic="true">Loadingâ€¦</p>
      </div>

      <!-- Page navigation -->
      <nav aria-label="Page navigation" class="flex gap-0 sm:gap-0.5 bg-indigo-800 rounded-lg p-0.5 shrink-0 overflow-x-auto max-w-full">
        <button id="nav-search" class="nav-tab nav-active" data-page="search" aria-current="page">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <span class="hidden sm:inline">Search</span>
        </button>
        
        <button id="nav-bookmarks" class="nav-tab" data-page="bookmarks">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
          </svg>
          <span class="hidden sm:inline">Bookmarks</span>
          <!-- bg-indigo-700 text-white on bg-indigo-800 nav â†’ white on dark âœ“ -->
          <span id="bm-count-badge" class="hidden text-[10px] bg-white text-indigo-800 rounded-full px-1.5 py-0.5 font-bold leading-none" aria-label="bookmarks count"></span>
        </button>
        <button id="nav-coding" class="nav-tab" data-page="coding">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
          </svg>
          <span class="hidden sm:inline">Coding</span>
        </button>
        <button id="nav-settings" class="nav-tab" data-page="settings">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span class="hidden sm:inline">Settings</span>
        </button>
      </nav>

      <!-- Multi-user: avatar menu (hidden in single mode via JS) -->
      <div id="user-menu" class="hidden relative shrink-0">

        <!-- Avatar trigger button -->
        <button id="user-avatar-btn"
                aria-haspopup="true" aria-expanded="false" aria-label="User menu"
                class="w-8 h-8 rounded-full bg-indigo-500 hover:bg-indigo-400 border-2 border-indigo-300
                       flex items-center justify-center text-white font-bold text-sm uppercase
                       transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-white
                       select-none cursor-pointer">
          <span id="user-avatar-initial">?</span>
        </button>

        <!-- Dropdown panel -->
        <div id="user-dropdown"
             class="hidden absolute right-0 top-full mt-2 w-48 bg-white rounded-xl shadow-xl border border-gray-200
                    py-1 z-50 origin-top-right"
             role="menu" aria-orientation="vertical">

          <!-- Username header -->
          <div class="px-4 py-2.5 border-b border-gray-100">
            <p class="text-xs text-gray-500">Signed in as</p>
            <p id="user-dropdown-name" class="text-sm font-semibold text-gray-900 truncate mt-0.5">â€”</p>
          </div>

          <!-- Admin (shown only for admins via JS) -->
          <button id="user-menu-admin"
                  class="hidden w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-gray-700
                         hover:bg-indigo-50 hover:text-indigo-700 transition-colors text-left"
                  role="menuitem">
            <svg class="w-4 h-4 shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            Admin
          </button>

          <!-- Settings -->
          <button id="user-menu-config"
                  class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-gray-700
                         hover:bg-indigo-50 hover:text-indigo-700 transition-colors text-left"
                  role="menuitem">
            <svg class="w-4 h-4 shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Settings
          </button>

          <!-- Logout -->
          <button id="logout-btn"
                  class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-red-600
                         hover:bg-red-50 transition-colors text-left"
                  role="menuitem">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Log Out
          </button>

        </div>
      </div>

    </div>
  </header>
