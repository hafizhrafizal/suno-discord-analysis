    <!-- -- BOOKMARKS PAGE ------------------------------------------------ -->
    <div id="page-bookmarks" class="hidden space-y-4">

      <!-- Sticky context-window control bar -->
      <div class="sticky top-[57px] z-30 bg-white rounded-2xl shadow border border-gray-200 px-4 py-2.5 flex flex-wrap items-center gap-x-5 gap-y-2"

        <span class="font-semibold text-sm text-gray-800">Context window</span>
        <label for="bm-ctx-before" class="flex items-center gap-1.5 text-sm text-gray-700">

        </label>
        <span class="text-xs text-gray-600">Changing values collapses open context panels.</span>
        <button id="bm-refresh-btn" class="ml-auto text-xs font-semibold text-indigo-700 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-700 rounded">Refresh</button>

          <label for="bm-month-to" class="flex items-center gap-1.5 text-sm text-gray-700">

            <input id="bm-month-to" type="date"
                   class="border border-gray-400 rounded-lg px-2 py-1 text-sm text-gray-900" />
          </label>
          <button id="bm-month-clear"
                  class="text-xs text-gray-400 hover:text-gray-700

            Clear

        <div class="flex items-center gap-2 mb-4 flex-wrap">

          <span id="bm-coded-count" class="hidden text-xs font-semibold px-2 py-0.5 rounded-full bg-green-50 text-green-700"></span>
          <button id="bm-close-all-panels" class="hidden ml-auto text-xs text-gray-500 hover:text-gray-700 border border-gray-300 hover:border-gray-400 rounded-lg px-2.5 py-0.5 transition-colors">Close all coding sections</button>
        </div>
        <div id="bookmarks-container" class="space-y-4" aria-live="polite">
          <p class="text-sm text-gray-600 text-center py-8">Loading bookmarksâ€¦</p>
